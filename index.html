<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Chat 2.0</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase App & Services -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="wolf-logo">🐺</div>
    <h2>WOLF CHAT 2.0</h2>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div class="developer-credit-node">BY THLOMPHO SWAFO</div>
  </div>

  <div id="desktop-ambient-viewport">
    <div id="app-wallpaper-shroud"></div>

    <!-- Auth Screen -->
    <div id="auth-screen" style="display: none;">
      <div class="auth-box">
        <div class="auth-brand-header">
          <div class="brand-glyph">🐺</div>
          <h2 id="auth-title">Wolf Chat 2.0</h2>
        </div>

        <div id="auth-form">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" placeholder="enter email..." required>
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="enter password..." required>
          </div>

          <!-- Extra Signup Fields -->
          <div id="signup-extra-fields" style="display: none;">
            <div class="input-group">
              <label>Username</label>
              <input type="text" id="username" placeholder="Choose a wolf handle...">
            </div>

            <div class="input-group">
              <label>Name Color</label>
              <input type="color" id="color-picker" value="#39ff14">
            </div>

            <div class="input-group">
              <label>Avatar Icon</label>
              <select id="auth-pfp-select">
                <option value="🐺">Wolf 🐺</option>
                <option value="🔥">Fire 🔥</option>
                <option value="⚡">Lightning ⚡</option>
                <option value="👑">Crown 👑</option>
                <option value="🎮">Gamer 🎮</option>
              </select>
            </div>
          </div>

          <button type="button" class="prime-action-btn" id="auth-main-btn" onclick="handleAuthSubmit()">Sign In</button>
          
          <p style="text-align: center; margin-top: 15px; font-size: 12px; color: var(--text-sub);">
            <a href="#" id="auth-toggle-mode" onclick="toggleAuthMode()" style="color: var(--primary-cyan); text-decoration: none;">Don't have an account? Sign up here</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-container" style="display: none;">

      <!-- Sidebar -->
      <div id="chat-sidebar" class="sidebar-hidden">
        <div style="padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
          <span class="panel-title">WOLF CHAT 2.0</span>
          <button onclick="toggleSidebarMenu()" style="background:none; border:none; color:var(--text-sub); font-size:18px; cursor:pointer;">✕</button>
        </div>

        <div class="sidebar-scrollable-zone">
          <div class="navigation-group">
            <label style="font-size: 11px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block;">Public Channels</label>
            <button class="navigation-item active-room" onclick="switchChannel('General-Alpha')"># General-Alpha</button>
            <button class="navigation-item" onclick="switchChannel('Tech-Hub')"># Tech-Hub</button>
            <button class="navigation-item" onclick="switchChannel('Gaming-Lounge')"># Gaming-Lounge</button>
          </div>

          <div class="navigation-group">
            <label style="font-size: 11px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block;">Direct Messages</label>
            <div id="dm-users-list"></div>
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="settings-trigger-btn" onclick="openSettingsModal()">⚙️ Settings</button>
          <button class="settings-trigger-btn" onclick="handleLogout()" style="margin-top: 8px; background: #3b1111; color: #ff5555; border-color: #521818;">🚪 Sign Out</button>
        </div>
      </div>

      <!-- Main Workspace -->
      <div id="chat-main">
        <!-- Header -->
        <div id="chat-header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <button id="hamburger-menu-btn" onclick="toggleSidebarMenu()">☰</button>
            <div id="chat-header-info" style="cursor: pointer; user-select: none;">
              <span id="active-chat-title">Room: General-Alpha</span>
            </div>
          </div>

          <div class="header-right-cluster">
            <button onclick="toggleNotificationFeed()" style="background:none; border:none; color:var(--text-main); font-size:18px; cursor:pointer; position:relative;" title="Notifications">
              🔔<span id="notification-badge" style="display:none; position:absolute; top:-2px; right:-2px; background:#ff0055; color:#fff; font-size:10px; border-radius:50%; padding:2px 5px;">0</span>
            </button>
            <button onclick="startCall(false)" style="background:none; border:none; color:var(--text-main); font-size:18px; cursor:pointer;" title="Voice Call">📞</button>
            <button onclick="startCall(true)" style="background:none; border:none; color:var(--text-main); font-size:18px; cursor:pointer; margin-right: 10px;" title="Video Call">📹</button>
            
            <div id="user-display-container" onclick="openSettingsModal()">
              <div id="header-pfp" class="user-pfp-small">🐺</div>
              <span id="user-display" style="color: var(--accent-green);">User</span>
            </div>
          </div>
        </div>

        <!-- Messages Area -->
        <div id="messages"></div>

        <!-- Typing Indicator -->
        <div id="typing-indicator-text" style="font-size: 11px; color: var(--text-sub); padding: 0 15px 4px 15px; height: 16px;"></div>

        <!-- Media Preview Tray -->
        <div id="media-preview-tray" style="display: none;">
          <div id="preview-content"></div>
          <button onclick="cancelMediaSelection()" style="background:none; border:none; color:#ff4444; cursor:pointer; font-size:16px;">✕</button>
        </div>

        <!-- Hidden File Inputs -->
        <input type="file" id="hidden-file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

        <!-- Attachment Drawer -->
        <div id="attachment-drawer-hud" style="display: none;">
          <div style="display: flex; gap: 10px;">
            <button onclick="triggerImageUpload()" style="background:var(--bg-input); border:1px solid var(--border-color); color:#fff; padding:8px 12px; border-radius:6px; cursor:pointer;">📷 Photo</button>
            <button onclick="injectSticker('🔥')" style="background:none; border:none; font-size:20px; cursor:pointer;">🔥</button>
            <button onclick="injectSticker('🐺')" style="background:none; border:none; font-size:20px; cursor:pointer;">🐺</button>
            <button onclick="injectSticker('👑')" style="background:none; border:none; font-size:20px; cursor:pointer;">👑</button>
            <button onclick="injectSticker('🎮')" style="background:none; border:none; font-size:20px; cursor:pointer;">🎮</button>
          </div>
        </div>

        <!-- Input Bar -->
        <div id="input-area-wrapper">
          <button class="utility-toggle-trigger" onclick="toggleAttachmentMenu()">📎</button>
          
          <div class="whatsapp-input-pill-container">
            <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleInputUpdate()" onkeydown="if(event.key === 'Enter') sendMessage()">
            <span id="char-counter-node" style="font-size: 10px; color: var(--text-sub);">0 / 250</span>
          </div>

          <button class="utility-toggle-trigger" onclick="sendMessage()" style="color: var(--primary-cyan); font-weight: bold;">➤</button>
          <button class="mic-standalone-btn" id="mic-record-btn" onclick="toggleVoiceRecording()">🎤</button>
        </div>
      </div>
    </div>

    <!-- System Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Personal Settings</h3>
          <button class="close-modal-btn" onclick="closeSettingsModal()">✕</button>
        </div>

        <div class="input-group">
          <label>Display Name</label>
          <input type="text" id="settings-username-input" placeholder="New display name...">
        </div>

        <div class="input-group">
          <label>Bio</label>
          <input type="text" id="settings-bio-input" placeholder="Your status bio...">
        </div>

        <div class="input-group">
          <label>Avatar Icon</label>
          <select id="settings-pfp-select">
            <option value="🐺">Wolf 🐺</option>
            <option value="🔥">Fire 🔥</option>
            <option value="⚡">Lightning ⚡</option>
            <option value="👑">Crown 👑</option>
            <option value="🎮">Gamer 🎮</option>
          </select>
        </div>

        <div class="input-group">
          <label>Custom Profile Picture (Gallery)</label>
          <input type="file" id="settings-custom-pfp" accept="image/*" onchange="handleCustomPfpSelect(event)">
          <div style="margin-top: 8px;">
            <img id="settings-pfp-preview" style="max-width: 60px; max-height: 60px; border-radius: 50%; object-fit: cover;">
          </div>
        </div>

        <div class="input-group">
          <label>Name Color</label>
          <input type="color" id="settings-color-picker" value="#39ff14">
        </div>

        <div class="input-group">
          <label>Personal App Wallpaper</label>
          <input type="file" id="settings-wallpaper-file" accept="image/*" onchange="handleCustomWallpaperSelect(event)">
          
          <label style="margin-top: 10px; display: block;">Or Pick Preset Wallpaper:</label>
          <div class="wallpaper-presets-grid" style="display: flex; gap: 8px; margin-top: 6px;">
            <button type="button" onclick="selectPresetWallpaper('')" style="padding: 6px 10px; background: #202c33; color: #fff; border: 1px solid #334155; border-radius: 4px; cursor: pointer;">Default Dark</button>
            <button type="button" onclick="selectPresetWallpaper('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000')" style="padding: 6px 10px; background: #202c33; color: #00ebff; border: 1px solid #00ebff; border-radius: 4px; cursor: pointer;">Cyber Neon</button>
          </div>
        </div>

        <div class="input-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="margin: 0;">Sleep Mode 🌙</label>
          <input type="checkbox" id="settings-sleep-toggle" style="width: auto;">
        </div>

        <button type="button" class="prime-action-btn" onclick="saveSystemSettings()" style="margin-top: 15px;">Save Settings</button>
      </div>
    </div>

    <!-- Dedicated DM Settings Modal -->
    <div id="dm-settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="dm-settings-title">Direct Message Customization</h3>
          <button class="close-modal-btn" onclick="closeDmSettingsModal()">✕</button>
        </div>

        <div class="input-group">
          <label>Set Custom Nickname for User</label>
          <input type="text" id="dm-nickname-input" placeholder="Enter custom nickname...">
        </div>

        <div class="input-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="margin: 0;">Mute Notifications</label>
          <input type="checkbox" id="dm-mute-toggle" style="width: auto;">
        </div>

        <div class="input-group">
          <label>Shared DM Chat Wallpaper</label>
          <input type="file" id="dm-wallpaper-file" accept="image/*" onchange="handleDmWallpaperSelect(event)">
        </div>

        <button type="button" class="prime-action-btn" onclick="saveDmSettings()" style="margin-top: 15px;">Save Chat Settings</button>
      </div>
    </div>

    <!-- User Profile Modal -->
    <div id="user-profile-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box" style="text-align: center;">
        <div class="modal-header">
          <h3>User Profile</h3>
          <button class="close-modal-btn" onclick="closeUserProfileModal()">✕</button>
        </div>
        <div id="profile-modal-pfp" style="margin-bottom:10px; font-size: 32px;">🐺</div>
        <div id="profile-modal-name" style="font-size:20px; font-weight:bold; color:#39ff14;">Username</div>
        <div id="profile-modal-status" style="font-size:12px; margin-bottom:12px; color:#888;">Online</div>
        <p id="profile-modal-bio" style="font-size:13px; color:#ccc; background:#182229; padding:8px; border-radius:6px; margin-bottom:16px;">Bio text goes here.</p>

        <div style="display:flex; justify-content:space-around; margin-bottom:16px; border-top:1px solid #222; border-bottom:1px solid #222; padding:10px 0;">
          <div>
            <div id="profile-followers-count" style="font-size:18px; font-weight:bold; color:#00ebff;">0</div>
            <div style="font-size:11px; color:#888;">Followers</div>
          </div>
          <div>
            <div id="profile-following-count" style="font-size:18px; font-weight:bold; color:#00ebff;">0</div>
            <div style="font-size:11px; color:#888;">Following</div>
          </div>
        </div>

        <div id="profile-modal-actions" style="display:flex; justify-content:center;"></div>
      </div>
    </div>

    <!-- Notification Feed Modal -->
    <div id="notification-feed-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Notifications</h3>
          <button class="close-modal-btn" onclick="toggleNotificationFeed()">✕</button>
        </div>
        <div id="notification-list" style="max-height: 300px; overflow-y: auto;"></div>
      </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-screen-overlay" style="display: none;">
      <h3 id="call-status-text" style="color: var(--primary-cyan); font-family: var(--font-heading); margin-bottom: 20px;">In Call</h3>
      <div class="video-grid-container">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
      </div>
      <button onclick="endActiveCall()" style="padding: 10px 25px; background: #ff0055; color: #fff; border: none; border-radius: 20px; font-weight: bold; cursor: pointer;">End Call</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
