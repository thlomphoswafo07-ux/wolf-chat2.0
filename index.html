<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Chat 2.0</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase App & Services -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="wolf-logo">🐺</div>
    <h2>WOLF CHAT 2.0</h2>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div class="developer-credit-node">INITIALIZING SYSTEM...</div>
  </div>

  <div id="desktop-ambient-viewport">
    <div id="app-wallpaper-shroud"></div>

    <!-- Auth Screen -->
    <div id="auth-screen" style="display: none;">
      <div class="auth-box">
        <div class="auth-brand-header">
          <div class="brand-glyph">🐺</div>
          <h2 id="auth-title">Wolf Chat 2.0</h2>
        </div>

        <div id="auth-form">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" placeholder="enter email..." required>
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="enter password..." required>
          </div>

          <!-- Extra Signup Fields -->
          <div id="signup-extra-fields" style="display: none;">
            <div class="input-group">
              <label>Username</label>
              <input type="text" id="username" placeholder="Choose a wolf handle...">
            </div>

            <div class="input-group">
              <label>Name Color</label>
              <input type="color" id="color-picker" value="#39ff14">
            </div>

            <div class="input-group">
              <label>Avatar Icon</label>
              <select id="auth-pfp-select">
                <option value="🐺">Wolf 🐺</option>
                <option value="🔥">Fire 🔥</option>
                <option value="⚡">Lightning ⚡</option>
                <option value="👑">Crown 👑</option>
                <option value="🎮">Gamer 🎮</option>
              </select>
            </div>
          </div>

          <button type="button" class="prime-action-btn" id="auth-main-btn" onclick="handleAuthSubmit()">Sign In</button>
          
          <p style="text-align: center; margin-top: 15px; font-size: 12px; color: var(--text-sub);">
            <a href="#" id="auth-toggle-mode" onclick="toggleAuthMode()" style="color: var(--primary-cyan); text-decoration: none;">Don't have an account? Sign up here</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-container" style="display: none;">

      <!-- Sidebar -->
      <div id="chat-sidebar" class="sidebar-hidden">
        <div style="padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
          <span class="panel-title">WOLF CHAT 2.0</span>
          <button onclick="toggleSidebarMenu()" style="background:none; border:none; color:var(--text-sub); font-size:18px; cursor:pointer;">✕</button>
        </div>

        <div class="sidebar-scrollable-zone">
          <div class="navigation-group">
            <label style="font-size: 11px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block;">Public Channels</label>
            <button class="navigation-item active-room" onclick="switchChannel('General-Alpha')"># General-Alpha</button>
            <button class="navigation-item" onclick="switchChannel('Tech-Hub')"># Tech-Hub</button>
            <button class="navigation-item" onclick="switchChannel('Gaming-Lounge')"># Gaming-Lounge</button>
          </div>

          <div class="navigation-group">
            <label style="font-size: 11px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block;">Direct Messages</label>
            <div id="dm-users-list"></div>
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="settings-trigger-btn" onclick="openSettingsModal()">⚙️ Settings</button>
          <button class="settings-trigger-btn" onclick="handleLogout()" style="margin-top: 8px; background: #3b1111; color: #ff5555; border-color: #521818;">🚪 Sign Out</button>
        </div>
      </div>

      <!-- Main Workspace -->
      <div id="chat-main">
        <!-- Header -->
        <div id="chat-header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <button id="hamburger-menu-btn" onclick="toggleSidebarMenu()">☰</button>
            <!-- Long-press enabled header area for DM Options -->
            <div id="chat-header-info" style="cursor: pointer; user-select: none;">
              <span id="active-chat-title">Room: General-Alpha</span>
            </div>
          </div>

          <div class="header-right-cluster">
            <button onclick="startCall(false)" style="background:none; border:none; color:var(--text-main); font-size:18px; cursor:pointer;" title="Voice Call">📞</button>
            <button onclick="startCall(true)" style="background:none; border:none; color:var(--text-main); font-size:18px; cursor:pointer; margin-right: 10px;" title="Video Call">📹</button>
            
            <div id="user-display-container">
              <div id="header-pfp" class="user-pfp-small">🐺</div>
              <span id="user-display" style="color: var(--accent-green);">User</span>
            </div>
          </div>
        </div>

        <!-- Messages Area -->
        <div id="messages"></div>

        <!-- Typing Indicator -->
        <div id="typing-indicator-text" style="font-size: 11px; color: var(--text-sub); padding: 0 15px 4px 15px; height: 16px;"></div>

        <!-- Media Preview Tray -->
        <div id="media-preview-tray" style="display: none;">
          <div id="preview-content"></div>
          <button onclick="cancelMediaSelection()" style="background:none; border:none; color:#ff4444; cursor:pointer; font-size:16px;">✕</button>
        </div>

        <!-- Hidden File Inputs -->
        <input type="file" id="hidden-file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

        <!-- Attachment Drawer -->
        <div id="attachment-drawer-hud" style="display: none;">
          <div style="display: flex; gap: 10px;">
            <button onclick="triggerImageUpload()" style="background:var(--bg-input); border:1px solid var(--border-color); color:#fff; padding:8px 12px; border-radius:6px; cursor:pointer;">📷 Photo</button>
            <button onclick="injectSticker('🔥')" style="background:none; border:none; font-size:20px; cursor:pointer;">🔥</button>
            <button onclick="injectSticker('🐺')" style="background:none; border:none; font-size:20px; cursor:pointer;">🐺</button>
            <button onclick="injectSticker('👑')" style="background:none; border:none; font-size:20px; cursor:pointer;">👑</button>
            <button onclick="injectSticker('🎮')" style="background:none; border:none; font-size:20px; cursor:pointer;">🎮</button>
          </div>
        </div>

        <!-- Input Bar -->
        <div id="input-area-wrapper">
          <button class="utility-toggle-trigger" onclick="toggleAttachmentMenu()">📎</button>
          
          <div class="whatsapp-input-pill-container">
            <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleInputUpdate()" onkeydown="if(event.key === 'Enter') sendMessage()">
            <span id="char-counter-node" style="font-size: 10px; color: var(--text-sub);">0 / 250</span>
          </div>

          <button class="utility-toggle-trigger" onclick="sendMessage()" style="color: var(--primary-cyan); font-weight: bold;">➤</button>
          <button class="mic-standalone-btn" id="mic-record-btn" onclick="toggleVoiceRecording()">🎤</button>
        </div>
      </div>
    </div>

    <!-- Personal Main Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Personal Settings</h3>
          <button class="close-modal-btn" onclick="closeSettingsModal()">✕</button>
        </div>

        <div class="input-group">
          <label>Display Name</label>
          <input type="text" id="settings-username-input" placeholder="New display name...">
        </div>

        <div class="input-group">
          <label>Avatar Icon</label>
          <select id="settings-pfp-select">
            <option value="🐺">Wolf 🐺</option>
            <option value="🔥">Fire 🔥</option>
            <option value="⚡">Lightning ⚡</option>
            <option value="👑">Crown 👑</option>
            <option value="🎮">Gamer 🎮</option>
          </select>
        </div>

        <div class="input-group">
          <label>Custom Profile Picture (Gallery)</label>
          <input type="file" id="settings-custom-pfp" accept="image/*" onchange="handleCustomPfpSelect(event)">
          <div style="margin-top: 8px;">
            <img id="settings-pfp-preview" style="max-width: 60px; max-height: 60px; border-radius: 50%; object-fit: cover;">
          </div>
        </div>

        <div class="input-group">
          <label>Name Color</label>
          <input type="color" id="settings-color-picker" value="#39ff14">
        </div>

        <!-- Personal App Wallpaper (Saved strictly locally on your device) -->
        <div class="input-group">
          <label>Personal App Wallpaper (Gallery)</label>
          <input type="file" id="settings-wallpaper-file" accept="image/*" onchange="handlePersonalWallpaperSelect(event)">
          
          <label style="margin-top: 10px; display: block;">Or Pick Preset Wallpaper:</label>
          <div class="wallpaper-presets-grid" style="display: flex; gap: 8px; margin-top: 6px;">
            <button type="button" onclick="selectPersonalPresetWallpaper('')" style="padding: 6px 10px; background: #202c33; color: #fff; border: 1px solid #334155; border-radius: 4px; cursor: pointer;">Default Dark</button>
            <button type="button" onclick="selectPersonalPresetWallpaper('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000')" style="padding: 6px 10px; background: #202c33; color: #00ebff; border: 1px solid #00ebff; border-radius: 4px; cursor: pointer;">Cyber Neon</button>
            <button type="button" onclick="selectPersonalPresetWallpaper('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000')" style="padding: 6px 10px; background: #202c33; color: #39ff14; border: 1px solid #39ff14; border-radius: 4px; cursor: pointer;">Deep Space</button>
          </div>
        </div>

        <div class="input-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="margin: 0;">Sleep Mode 🌙</label>
          <input type="checkbox" id="settings-sleep-toggle" style="width: auto;">
        </div>

        <button type="button" class="prime-action-btn" onclick="saveSystemSettings()" style="margin-top: 15px;">Save Settings</button>
      </div>
    </div>

    <!-- Long-Press DM Action Pop-up Header Menu -->
    <div id="dm-longpress-popup" class="modal-overlay" style="display: none;">
      <div class="modal-box" style="max-width: 300px; text-align: center;">
        <h3 id="dm-popup-target-name" style="margin-bottom: 15px;">DM Options</h3>
        <button class="prime-action-btn" onclick="openDMSettingsPage()" style="margin-bottom: 10px;">⚙️ Chat Settings & Customization</button>
        <button onclick="closeDMLongPressPopup()" style="background: transparent; border: none; color: var(--text-sub); cursor: pointer;">Cancel</button>
      </div>
    </div>

    <!-- Dedicated DM Settings Page Modal -->
    <div id="dm-settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="dm-settings-title">Direct Message Customization</h3>
          <button class="close-modal-btn" onclick="closeDMSettingsModal()">✕</button>
        </div>

        <!-- Custom Nickname -->
        <div class="input-group">
          <label>Set Custom Nickname for User</label>
          <input type="text" id="dm-nickname-input" placeholder="Enter custom nickname...">
        </div>

        <!-- Mute Notifications toggle -->
        <div class="input-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="margin: 0;">Mute Notifications</label>
          <input type="checkbox" id="dm-mute-toggle" style="width: auto;">
        </div>

        <!-- DM Shared Wallpaper (Syncs across both chat members) -->
        <div class="input-group">
          <label>Shared DM Chat Wallpaper (Gallery)</label>
          <input type="file" id="dm-wallpaper-file" accept="image/*" onchange="handleDMWallpaperSelect(event)">
        </div>

        <button type="button" class="prime-action-btn" onclick="saveDMSettings()" style="margin-top: 15px;">Save Chat Settings</button>
      </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-screen-overlay" style="display: none;">
      <h3 id="call-status-text" style="color: var(--primary-cyan); font-family: var(--font-heading); margin-bottom: 20px;">In Call</h3>
      <div class="video-grid-container">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
      </div>
      <button onclick="endActiveCall()" style="padding: 10px 25px; background: #ff0055; color: #fff; border: none; border-radius: 20px; font-weight: bold; cursor: pointer;">End Call</button>
    </div>

  </div>

  <script src="script.js"></script>
<!-- ========================================================================= -->
<!-- DM SETTINGS & CUSTOMIZATION MODAL (ITEM 1 & 2) -->
<!-- ========================================================================= -->
<div id="dm-settings-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;">
  <div class="modal-content" style="background: #111b21; border: 1px solid #00ebff; border-radius: 12px; width: 90%; max-width: 420px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(0, 235, 255, 0.2);">
    
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; padding-bottom: 10px; margin-bottom: 15px;">
      <h3 style="margin: 0; color: #00ebff; font-size: 18px;">⚙️ DM Customization</h3>
      <button onclick="closeDmSettingsModal()" style="background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer;">✕</button>
    </div>

    <!-- Custom Nickname -->
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-size: 12px; color: #8696a0; margin-bottom: 5px;">Custom Nickname (Only visible to you)</label>
      <input type="text" id="dm-nickname-input" placeholder="Enter nickname..." style="width: 100%; padding: 10px; background: #202c33; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
    </div>

    <!-- Mute Notifications Toggle -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #182229; padding: 10px; border-radius: 6px;">
      <span style="font-size: 14px; color: #e9edef;">Mute Notifications</span>
      <input type="checkbox" id="dm-mute-toggle" style="accent-color: #00ebff; width: 18px; height: 18px; cursor: pointer;">
    </div>

    <!-- Shared DM Wallpaper -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 12px; color: #8696a0; margin-bottom: 5px;">Shared Chat Background</label>
      <input type="file" id="dm-wallpaper-input" accept="image/*" onchange="handleDmWallpaperSelect(event)" style="display: none;">
      <button onclick="document.getElementById('dm-wallpaper-input').click()" style="width: 100%; padding: 10px; background: #202c33; border: 1px dashed #00ebff; border-radius: 6px; color: #00ebff; cursor: pointer; font-weight: bold;">
        🖼️ Upload Shared DM Wallpaper
      </button>
    </div>

    <!-- Modal Actions -->
    <div style="display: flex; gap: 10px;">
      <button onclick="saveDmSettings()" style="flex: 1; padding: 10px; background: #00ebff; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer;">Save DM Settings</button>
      <button onclick="closeDmSettingsModal()" style="padding: 10px; background: #202c33; border: 1px solid #334155; border-radius: 6px; color: #8696a0; cursor: pointer;">Cancel</button>
    </div>

  </div>
</div>

<!-- ========================================================================= -->
<!-- UPDATED SYSTEM SETTINGS MODAL (WITH PERSONAL WALLPAPER CONTROLS) -->
<!-- ========================================================================= -->
<div id="settings-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9998; justify-content: center; align-items: center;">
  <div class="modal-content" style="background: #111b21; border: 1px solid #39ff14; border-radius: 12px; width: 90%; max-width: 440px; padding: 20px; color: #fff; max-height: 85vh; overflow-y: auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; padding-bottom: 10px; margin-bottom: 15px;">
      <h3 style="margin: 0; color: #39ff14; font-size: 18px;">⚙️ App Settings</h3>
      <button onclick="closeSettingsModal()" style="background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer;">✕</button>
    </div>

    <!-- Profile Customization -->
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-size: 12px; color: #8696a0; margin-bottom: 5px;">Display Name</label>
      <input type="text" id="settings-username-input" placeholder="New display name" style="width: 100%; padding: 10px; background: #202c33; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
      <div style="flex: 1;">
        <label style="display: block; font-size: 12px; color: #8696a0; margin-bottom: 5px;">Username Color</label>
        <input type="color" id="settings-color-picker" value="#39ff14" style="width: 100%; height: 38px; background: #202c33; border: 1px solid #334155; border-radius: 6px; cursor: pointer;">
      </div>
      <div style="flex: 1;">
        <label style="display: block; font-size: 12px; color: #8696a0; margin-bottom: 5px;">Avatar Icon</label>
        <select id="settings-pfp-select" style="width: 100%; padding: 9px; background: #202c33; border: 1px solid #334155; border-radius: 6px; color: #fff;">
          <option value="🐺">🐺 Wolf</option>
          <option value="👑">👑 Crown</option>
          <option value="⚡">⚡ Bolt</option>
          <option value="🔥">🔥 Fire</option>
          <option value="🎯">🎯 Target</option>
        </select>
      </div>
    </div>

    <!-- Local App Wallpaper (Item 1 Fix) -->
    <div style="margin-bottom: 15px; border-top: 1px solid #222d34; padding-top: 15px;">
      <label style="display: block; font-size: 12px; color: #8696a0; margin-bottom: 5px;">Personal App Wallpaper (Local Storage Only)</label>
      <input type="file" id="local-wallpaper-input" accept="image/*" onchange="handleCustomWallpaperSelect(event)" style="display: none;">
      <button onclick="document.getElementById('local-wallpaper-input').click()" style="width: 100%; padding: 10px; background: #202c33; border: 1px solid #334155; border-radius: 6px; color: #fff; cursor: pointer; margin-bottom: 8px;">
        📷 Upload Local Wallpaper
      </button>
      <div style="display: flex; gap: 6px;">
        <button onclick="selectPresetWallpaper('')" style="flex: 1; padding: 6px; background: #182229; border: 1px solid #334155; border-radius: 4px; color: #aaa; font-size: 11px; cursor: pointer;">Default Dark</button>
        <button onclick="selectPresetWallpaper('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800')" style="flex: 1; padding: 6px; background: #182229; border: 1px solid #334155; border-radius: 4px; color: #aaa; font-size: 11px; cursor: pointer;">Cyber Grid</button>
      </div>
    </div>

    <!-- Sleep Mode -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #182229; padding: 10px; border-radius: 6px;">
      <span style="font-size: 14px; color: #e9edef;">Sleep Mode 🌙</span>
      <input type="checkbox" id="settings-sleep-toggle" style="accent-color: #39ff14; width: 18px; height: 18px; cursor: pointer;">
    </div>

    <!-- Actions -->
    <div style="display: flex; gap: 10px;">
      <button onclick="saveSystemSettings()" style="flex: 1; padding: 10px; background: #39ff14; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer;">Save Settings</button>
      <button onclick="closeSettingsModal()" style="padding: 10px; background: #202c33; border: 1px solid #334155; border-radius: 6px; color: #8696a0; cursor: pointer;">Cancel</button>
    </div>

  </div>
</div>
 </body>
</html>
