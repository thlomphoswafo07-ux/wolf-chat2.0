<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Chat 2.0</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <!-- PeerJS Engine for Video & Audio Calls -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- 1. Loading Screen -->
  <div id="loading-screen">
    <div class="wolf-logo">🐺</div>
    <h2>WOLF CHAT</h2>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div class="developer-credit-node">DEVELOPED BY THLOMPHO SWAFO</div>
  </div>

  <!-- 2. Desktop Ambient Viewport -->
  <div id="desktop-ambient-viewport">
    <div id="app-wallpaper-shroud"></div>

    <!-- Auth Screen -->
    <div id="auth-screen">
      <div class="auth-box">
        <div class="auth-brand-header">
          <span class="brand-glyph">🐺</span>
          <h2 id="auth-title">Welcome to Wolf Chat</h2>
        </div>

        <div class="input-group">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="Enter your password">
        </div>

        <!-- Extra fields for Sign Up -->
        <div id="signup-extra-fields" style="display: none;">
          <div class="input-group">
            <label for="username">Display Name</label>
            <input type="text" id="username" placeholder="Choose a username">
          </div>
          <div class="input-group">
            <label for="auth-pfp-select">Choose Avatar</label>
            <select id="auth-pfp-select">
              <option value="🐺">🐺 Wolf</option>
              <option value="👑">👑 Crown</option>
              <option value="⚡">⚡ Lightning</option>
              <option value="🔥">🔥 Fire</option>
              <option value="🎮">🎮 Gamer</option>
            </select>
          </div>
          <div class="input-group">
            <label for="color-picker">Username Color</label>
            <input type="color" id="color-picker" value="#39ff14">
          </div>
        </div>

        <button id="auth-main-btn" class="prime-action-btn" onclick="handleAuthSubmit()">Sign In</button>
        
        <p style="text-align: center; margin: 15px 0; font-size: 12px; color: #8696a0;">
          <a href="#" id="auth-toggle-mode" onclick="toggleAuthMode()" style="color: #00ebff; text-decoration: none;">Don't have an account? Sign up here</a>
        </p>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button class="prime-action-btn" style="background: #4285F4; color: #fff;" onclick="handleGoogleSignIn()">Google</button>
          <button class="prime-action-btn" style="background: #1877F2; color: #fff;" onclick="handleFacebookSignIn()">Facebook</button>
        </div>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-container" style="display: none;">

      <!-- Sidebar Drawer -->
      <div id="chat-sidebar" class="sidebar-hidden">
        <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34;">
          <h3 class="panel-title">ROOMS & DMs</h3>
          <button onclick="toggleSidebarMenu()" style="background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer;">✕</button>
        </div>

        <div class="sidebar-scrollable-zone">
          <!-- Public Channels Section -->
          <div class="navigation-group">
            <p style="font-size: 11px; color: #8696a0; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Public Rooms</p>
            <button class="navigation-item active-room" onclick="switchChannel('General-Alpha')">🌐 General Room</button>
            <button class="navigation-item" onclick="switchChannel('The-Lounge')">💬 The Lounge</button>
            <button class="navigation-item" onclick="switchChannel('Gaming-Zone')">🎮 Gaming Zone</button>
          </div>

          <!-- Direct Messages Section -->
          <div class="navigation-group">
            <p style="font-size: 11px; color: #00ebff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Direct Messages</p>
            <div id="dm-users-list">
              <!-- Registered online users will automatically render here dynamically -->
            </div>
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="settings-trigger-btn" onclick="openSettingsModal()">⚙️ Settings</button>
          <button class="settings-trigger-btn" style="background: #a80000; margin-top: 8px; border: none;" onclick="handleLogout()">🚪 Log Out</button>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div id="chat-main">
        <div id="chat-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <button id="hamburger-menu-btn" onclick="toggleSidebarMenu()">☰</button>
            <h3 id="active-chat-title" style="font-size: 16px; color: #fff;">Room: General-Alpha</h3>
          </div>

          <div class="header-right-cluster" style="display: flex; gap: 12px; align-items: center;">
            <!-- Call Triggers -->
            <button onclick="startCall(false)" style="background: transparent; border: none; font-size: 18px; cursor: pointer;" title="Audio Call">📞</button>
            <button onclick="startCall(true)" style="background: transparent; border: none; font-size: 18px; cursor: pointer;" title="Video Call">📹</button>

            <div id="user-display-container">
              <span id="header-pfp" class="user-pfp-small">🐺</span>
              <span id="user-display">User</span>
            </div>
          </div>
        </div>

        <!-- Messages Feed -->
        <div id="messages" style="flex: 1; padding: 15px; overflow-y: auto;"></div>

        <!-- Media Attachment Preview Tray -->
        <div id="media-preview-tray" style="display: none; padding: 10px; background: #111b21; border-top: 1px solid #222d34; align-items: center; justify-content: space-between;">
          <div id="preview-content"></div>
          <button onclick="cancelMediaSelection()" style="background: transparent; border: none; color: #ff0055; font-size: 18px; cursor: pointer;">✕</button>
        </div>

        <!-- Input Control Panel -->
        <div id="input-area-wrapper" style="padding: 10px; display: flex; align-items: center; gap: 8px; position: relative;">
          
          <!-- Attachment Menu Drawer -->
          <div id="attachment-drawer-hud" style="display: none; position: absolute; bottom: 60px; left: 10px; background: #111b21; border: 1px solid #222d34; border-radius: 8px; padding: 10px; z-index: 10;">
            <button onclick="triggerImageUpload()" style="background: #202c33; border: none; color: #fff; padding: 8px; border-radius: 6px; cursor: pointer; display: block; width: 100%; margin-bottom: 5px;">📷 Photo</button>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
              <button onclick="injectSticker('🔥')" style="background: transparent; border: none; font-size: 20px; cursor: pointer;">🔥</button>
              <button onclick="injectSticker('⚡')" style="background: transparent; border: none; font-size: 20px; cursor: pointer;">⚡</button>
              <button onclick="injectSticker('🎮')" style="background: transparent; border: none; font-size: 20px; cursor: pointer;">🎮</button>
            </div>
          </div>

          <button class="utility-toggle-trigger" onclick="toggleAttachmentMenu()">📎</button>
          <input type="file" id="hidden-file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

          <div class="whatsapp-input-pill-container" style="flex: 1; display: flex; align-items: center;">
            <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleInputUpdate()" onkeyup="if(event.key==='Enter') sendMessage()" style="width: 100%;">
            <span id="char-counter-node" style="font-size: 10px; color: #8696a0; margin-left: 5px;">0/250</span>
          </div>

          <button class="mic-standalone-btn" id="mic-record-btn" onclick="toggleVoiceRecording()">🎤</button>
          <button class="prime-action-btn" style="width: auto; padding: 10px 15px;" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Video / Audio Call Modal Overlay -->
  <div id="call-screen-overlay" class="modal-overlay" style="display: none; z-index: 3000;">
    <div class="modal-box" style="width: 90%; max-width: 600px; text-align: center; background: #0b141a;">
      <h3 id="call-status-text" style="color: #00ebff; margin-bottom: 15px;">In Call...</h3>
      
      <!-- Video Streams Container -->
      <div style="position: relative; width: 100%; height: 300px; background: #111b21; border-radius: 12px; overflow: hidden; margin-bottom: 15px;">
        <!-- Remote User Video (Full screen) -->
        <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <!-- Local User Video (PIP Preview) -->
        <video id="local-video" autoplay playsinline muted style="position: absolute; bottom: 10px; right: 10px; width: 100px; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid #00ebff; background: #000;"></video>
      </div>

      <!-- Call Control Buttons -->
      <div style="display: flex; justify-content: center; gap: 15px;">
        <button id="toggle-mic-btn" onclick="toggleMuteMic()" style="background: #202c33; border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer;">🎤</button>
        <button id="toggle-cam-btn" onclick="toggleMuteCam()" style="background: #202c33; border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer;">📹</button>
        <button onclick="endActiveCall()" style="background: #ff0055; border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer;">🛑</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="color: #00ebff;">Profile Settings</h3>
        <button class="close-modal-btn" onclick="closeSettingsModal()">✕</button>
      </div>

      <div class="input-group">
        <label for="settings-username-input">Update Username</label>
        <input type="text" id="settings-username-input" placeholder="New display name">
      </div>

      <div class="input-group">
        <label for="settings-pfp-select">Avatar Icon</label>
        <select id="settings-pfp-select">
          <option value="🐺">🐺 Wolf</option>
          <option value="👑">👑 Crown</option>
          <option value="⚡">⚡ Lightning</option>
          <option value="🔥">🔥 Fire</option>
          <option value="🎮">🎮 Gamer</option>
        </select>
      </div>

      <div class="input-group">
        <label for="settings-color-picker">Username Color</label>
        <input type="color" id="settings-color-picker" value="#39ff14">
      </div>

      <button class="prime-action-btn" onclick="saveSystemSettings()">Save Changes</button>
    </div>
  </div>

  <!-- Notification Sound Audio Element -->
  <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
