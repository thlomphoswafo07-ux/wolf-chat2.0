<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Chat</title>
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen (Exactly 4 Seconds) -->
  <div id="loading-screen">
    <div class="wolf-logo">🐺</div>
    <h2>WOLF CHAT</h2>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div class="developer-credit-node">BY THLOMPHO SWAFO</div>
  </div>

  <div id="desktop-ambient-viewport">
    <div id="app-wallpaper-shroud"></div>

    <!-- Authentication Screen -->
    <div id="auth-screen">
      <div class="auth-box">
        <div class="auth-brand-header">
          <span class="brand-glyph">🐺</span>
          <h2 id="auth-title">Welcome to Wolf Chat</h2>
        </div>
        
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" placeholder="you@example.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="auth-password" placeholder="••••••••">
        </div>

        <div id="signup-extra-fields" style="display: none;">
          <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Choose a username...">
          </div>
          <div class="input-group">
            <label>Profile Icon</label>
            <select id="auth-pfp-select">
              <option value="🐺">Wolf</option>
              <option value="🥷">Ninja</option>
              <option value="🦾">Cyber</option>
              <option value="⚡">Volt</option>
            </select>
          </div>
          <div class="input-group">
            <label>Name Color</label>
            <input type="color" id="color-picker" value="#39ff14">
          </div>
        </div>

        <button class="prime-action-btn" id="auth-main-btn" onclick="handleAuthSubmit()">Sign In</button>
        
        <div class="auth-divider">OR CONTINUE WITH</div>
        <div class="social-auth-row" style="display: flex; gap: 10px; margin-bottom: 15px;">
          <button class="prime-action-btn social-btn" onclick="handleGoogleSignIn()">🌐 Google</button>
          <button class="prime-action-btn social-btn" onclick="handleFacebookSignIn()">📘 Facebook</button>
        </div>

        <div class="developer-credit-node" id="auth-toggle-mode" onclick="toggleAuthMode()" style="cursor: pointer; text-align: center;">
          Don't have an account? Sign up here
        </div>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-container" style="display: none;">
      
      <!-- Responsive Sidebar Menu -->
      <div id="chat-sidebar" class="sidebar-hidden">
        <div id="sidebar-main-view">
          <div class="sidebar-header">
            <h1 class="panel-title">MENU</h1>
            <button class="close-modal-btn" onclick="toggleSidebarMenu()">✕</button>
          </div>
          
          <div class="sidebar-scrollable-zone">
            <div class="navigation-group">
              <button class="navigation-item" onclick="showHomeTab()">🏠 Home (People & Requests)</button>
              <button class="navigation-item active-room" onclick="switchChannel('General-Alpha')">🌐 General Room</button>
            </div>
            
            <div class="navigation-group">
              <span class="group-label">Direct Messages</span>
              <div id="dm-users-list"></div>
            </div>
          </div>

          <div class="sidebar-footer">
            <button class="settings-trigger-btn" onclick="openSettingsModal()">⚙️ Settings</button>
          </div>
        </div>
      </div>

      <!-- Main Workspace -->
      <div id="chat-main">
        <div id="chat-header">
          <button id="hamburger-menu-btn" onclick="toggleSidebarMenu()">☰</button>
          <div id="current-room-display">
            <div id="active-chat-title">Room: General-Alpha</div>
            <div id="target-last-active"></div>
          </div>
          <div class="header-right-cluster">
            <div id="user-display-container">
              <span id="user-display">---</span>
              <div id="header-pfp" class="user-pfp-small">🐺</div>
            </div>
          </div>
        </div>

        <!-- Home View Tab -->
        <div id="home-view" style="display: none; padding: 20px; overflow-y: auto; flex: 1;">
          <h3 style="color: #00ebff; margin-bottom: 10px;">Follow Requests & Notifications</h3>
          <div id="follow-requests-list"></div>

          <h3 style="color: #39ff14; margin-top: 20px; margin-bottom: 10px;">Suggested Accounts to Follow</h3>
          <div id="suggested-users-list"></div>
        </div>

        <!-- Active Chat Area View -->
        <div id="chat-view" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
          <div id="messages" style="flex: 1; overflow-y: auto; padding: 15px;"></div>
          <div id="typing-indicator"></div>

          <div id="media-preview-tray" style="display:none; padding: 10px;">
            <div id="preview-content"></div>
            <button class="close-modal-btn" onclick="cancelMediaSelection()">✕</button>
          </div>

          <div id="input-area-wrapper">
            <div id="attachment-drawer-hud" style="display:none; padding:10px;">
              <button class="drawer-action-node" onclick="triggerImageUpload()">🖼️ Upload Image</button>
              <input type="file" id="hidden-file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
              <div class="drawer-sticker-separator"><span>STICKERS</span></div>
              <div class="sticker-grid-layout" style="display:flex; gap:10px; margin-top:5px;">
                <button class="sticker-item" onclick="injectSticker('🔥')">🔥</button>
                <button class="sticker-item" onclick="injectSticker('👑')">👑</button>
                <button class="sticker-item" onclick="injectSticker('👾')">👾</button>
                <button class="sticker-item" onclick="injectSticker('🎯')">🎯</button>
              </div>
            </div>

            <div id="input-area" style="display: flex; align-items: center; gap: 8px; padding: 10px;">
              <div class="whatsapp-input-pill-container" style="flex: 1; display: flex; align-items: center;">
                <input type="text" id="msg-input" placeholder="Type a message..." maxlength="250" oninput="handleInputUpdate()" onkeydown="if(event.key==='Enter') sendMessage()" style="width: 100%;">
                <span id="char-counter-node" style="font-size:10px; opacity:0.5; margin-right:8px;">0 / 250</span>
                <button id="plus-attach-btn" class="utility-toggle-trigger" onclick="toggleAttachmentMenu()">+</button>
              </div>
              <button id="mic-record-btn" class="mic-standalone-btn" onclick="toggleVoiceRecording()">🎤</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Profile Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Profile Settings</h3>
        <button class="close-modal-btn" onclick="closeSettingsModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>Change Display Name</label>
          <input type="text" id="settings-username-input" placeholder="Enter new username...">
        </div>
        <div class="input-group">
          <label>Profile Icon</label>
          <select id="settings-pfp-select">
            <option value="🐺">Wolf</option>
            <option value="🥷">Ninja</option>
            <option value="🦾">Cyber</option>
            <option value="⚡">Volt</option>
          </select>
        </div>
        <div class="input-group">
          <label>Name Color</label>
          <input type="color" id="settings-color-picker" value="#39ff14">
        </div>
        
        <button class="prime-action-btn" onclick="saveSystemSettings()" style="width:100%; margin-top:10px;">Save Changes</button>
        <button class="logout-btn-modal" onclick="handleLogout()" style="width:100%; margin-top:10px;">Log Out</button>
      </div>
    </div>
  </div>

  <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-84.wav" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
